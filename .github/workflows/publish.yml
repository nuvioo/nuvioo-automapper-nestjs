name: Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.22.1
                  registry-url: https://npm.pkg.github.com
                  scope: '@nuvioo'
                  cache: npm
            - run: npm ci
            - name: Tag matches package version
              run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
            # prepublishOnly runs typecheck, tests and build first. Fork versions are always prereleases
            # (<upstream>-nuvioo.<n>), which npm only publishes with an explicit dist-tag.
            - run: npm publish --tag latest
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
